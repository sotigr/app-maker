# Two ways to run the tracker example with the framework image.
# Build the image first, from the repository root:  docker build -t organon .
#
# Development (hot reload, seed data, fake LLM; state in examples/tracker/.organon):
#   UID=$(id -u) GID=$(id -g) docker compose -f examples/docker/compose.yaml up dev
# Production-style server (state in the "data" volume):
#   docker compose -f examples/docker/compose.yaml up app
services:
  dev:
    image: organon
    command: ["organon", "dev", "/app", "--addr", ":8080"]
    user: "${UID:-1000}:${GID:-1000}"       # files written to the mount stay yours
    volumes:
      - ../tracker:/app                      # edit on the host, the server reloads
    ports: ["8080:8080"]

  app:
    image: organon
    volumes:
      - ../tracker:/app:ro                   # or build an app image FROM organon (see Dockerfile)
      - data:/data
    environment:
      ORGANON_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      ORGANON_BOOTSTRAP_ADMIN_PASSWORD: change-me-please   # first start only; use a secret in real deployments
      ORGANON_CURSOR_KEY: replace-with-a-long-random-string
      ORGANON_SECRET_ISSUES_WEBHOOK: replace-me            # ${secret:issues-webhook} in the tracker manifest
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/readyz')"]
      interval: 10s
      start_period: 20s

volumes:
  data:
